# HerdBook reverse proxy.
# Copy to /etc/nginx/sites-available/herdbook, then:
#   sudo ln -s /etc/nginx/sites-available/herdbook /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace server_name with your domain if you have one (required for HTTPS).

server {
    listen 80;
    server_name 129.121.133.174;   # change to your domain when available

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
